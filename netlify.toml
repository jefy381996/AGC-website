# Netlify / Cloudflare Pages configuration.
#
# Before deploying to either of these, open src/data/site.js and set:
#     base: ''
#     url:  'https://your-site-name.netlify.app'
# GitHub Pages serves the site from a /AGC-website/ subfolder; Netlify and
# Cloudflare serve it from the root, so the base prefix must be emptied.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long cache for fingerprint-free but rarely changed assets.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
